      steps:
        - title: "Planning and Discovery"
          body: "In this initial phase, we work with the client to understand needs, goals, and project vision. We run a kickoff to gather essential information and establish a clear understanding of scope and requirements. At the end, we prepare a detailed plan that guides the rest of development."
          deliverables: "Delivery timelines, detailed by sprint and completed task"
          duration: "1 to 2 weeks"
        - title: "Ux/Ui Design"
          body: "In this phase, we focus on creating an intuitive user experience and an attractive, functional interface. That includes wireframes, prototypes, and mockups to visualize the software's structure and navigation flow."
          deliverables: "UX and UI documentation with research, wireframes, final design, and prototyping"
          duration: "3 to 5 weeks"
        - title: "Development"
          body: "In the production stage, the team turns concepts and designs into code. That includes implementing features, system integrations, and creating databases according to the project scope."
          deliverables: "Development and implementation of the final design"
          duration: "4+ weeks"
        - title: "Testing and Quality Assurance"
          body: "After development, we run rigorous tests to identify and fix defects or functionality issues in the software."
          deliverables: "Report with all test results"
          duration: "2+ weeks"
        - title: "Delivery and Maintenance"
          body: "After testing is complete and final approval is given, we deliver production-ready software. We also offer ongoing maintenance so your software stays updated, secure, and running smoothly over the long term."
          deliverables: "Finished software with monitoring and maintenance"
          duration: "To be negotiated"

    faq:
      title: "FAQ"
      items:
        - question: "What can I expect when running a project with Square Soft?"
          answer: "A collaborative, client-centered approach. We prioritize clear communication, transparency, and understanding your business needs, with a focus on delivering high-quality solutions aligned with your goals."
        - question: "Are projects developed by Square Soft scalable?"
          answer: "Yes. We specialize in scalable solutions — whether for a small user base or for millions. We build systems ready to grow with your business."
        - question: "How much does it cost to build an app with Square Soft?"
          answer: "Investment depends on complexity, features, and tech stack. We offer tailored solutions. Talk to our team for an assessment and a transparent quote."
        - question: "What technologies does Square Soft specialize in?"
          answer: "We choose the right stack for each project. We work with React/React Native, Ruby on Rails, Go, Python/Django, NestJS/Next.js, Flutter, and many other modern technologies."
        - question: "How long does it take to develop software with Square Soft?"
          answer: "Timeline varies with scope. We follow an agile methodology, set realistic milestones with the client, and keep you informed at every stage."
        - question: "Do you offer support and maintenance for projects?"
          answer: "Yes. We offer post-launch support and maintenance to ensure performance, security, and continuous product evolution."
        - question: "How does Square Soft ensure the security of the software it builds?"
          answer: "We follow industry best practices, run security assessments, and implement robust measures to protect your application against threats."

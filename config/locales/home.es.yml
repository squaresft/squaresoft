    faq:
      title: "FAQ"
      items:
        - question: "¿Qué puedo esperar al ejecutar un proyecto con Square Soft?"
          answer: "Un enfoque colaborativo y centrado en el cliente. Priorizamos la comunicación clara, la transparencia y el entendimiento de las necesidades de tu negocio, con foco en entregar soluciones de alta calidad alineadas con tus objetivos."
        - question: "¿Los proyectos desarrollados por Square Soft son escalables?"
          answer: "Sí. Nos especializamos en soluciones escalables — ya sea para una base pequeña de usuarios o para millones. Construimos sistemas listos para crecer con tu negocio."
        - question: "¿Cuánto cuesta construir una app con Square Soft?"
          answer: "La inversión depende de la complejidad, las funcionalidades y el stack tecnológico. Ofrecemos soluciones a medida. Habla con nuestro equipo para una evaluación y una cotización transparente."
        - question: "¿En qué tecnologías se especializa Square Soft?"
          answer: "Elegimos el stack adecuado para cada proyecto. Trabajamos con React/React Native, Ruby on Rails, Go, Python/Django, NestJS/Next.js, Flutter y muchas otras tecnologías modernas."
        - question: "¿Cuánto tiempo toma desarrollar software con Square Soft?"
          answer: "El plazo varía según el alcance. Seguimos una metodología ágil, definimos hitos realistas con el cliente y te mantenemos informado en cada etapa."
        - question: "¿Ofrecen soporte y mantenimiento para los proyectos?"
          answer: "Sí. Ofrecemos soporte y mantenimiento post-lanzamiento para asegurar rendimiento, seguridad y evolución continua del producto."
        - question: "¿Cómo garantiza Square Soft la seguridad del software que construye?"
          answer: "Seguimos las mejores prácticas de la industria, realizamos evaluaciones de seguridad e implementamos medidas robustas para proteger tu aplicación contra amenazas."

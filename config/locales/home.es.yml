    process:
      title: "Cómo funciona nuestro proceso"
      tabs_aria: "Etapas del proceso"
      deliverables: "Entregables"
      duration: "Duración"
      tabs:
        - "Planificación"
        - "Ux/Ui Design"
        - "Producción"
        - "Testing & QA"
        - "Entrega y mantenimiento"
      steps:
        - title: "Planificación y Discovery"
          body: "En esta fase inicial, trabajamos con el cliente para entender necesidades, objetivos y la visión del proyecto. Realizamos un kickoff para reunir la información esencial y establecer un entendimiento claro del alcance y los requisitos. Al final, preparamos un plan detallado que guía el resto del desarrollo."
          deliverables: "Cronogramas de entrega, detallados por sprint y tarea completada"
          duration: "1 a 2 semanas"
        - title: "Ux/Ui Design"
          body: "En esta fase, nos enfocamos en crear una experiencia de usuario intuitiva y una interfaz atractiva y funcional. Eso incluye wireframes, prototipos y mockups para visualizar la estructura del software y el flujo de navegación."
          deliverables: "Documentación de UX y UI con investigación, wireframes, diseño final y prototipado"
          duration: "3 a 5 semanas"
        - title: "Desarrollo"
          body: "En la etapa de producción, el equipo convierte conceptos y diseños en código. Eso incluye implementar funcionalidades, integraciones de sistemas y crear bases de datos según el alcance del proyecto."
          deliverables: "Desarrollo e implementación del diseño final"
          duration: "4+ semanas"
        - title: "Testing y Quality Assurance"
          body: "Después del desarrollo, ejecutamos pruebas rigurosas para identificar y corregir defectos o problemas de funcionalidad en el software."
          deliverables: "Informe con todos los resultados de las pruebas"
          duration: "2+ semanas"
        - title: "Entrega y Mantenimiento"
          body: "Cuando las pruebas terminan y se da la aprobación final, entregamos el software listo para producción. También ofrecemos mantenimiento continuo para que tu software se mantenga actualizado, seguro y funcionando bien a largo plazo."
          deliverables: "Software terminado con monitoreo y mantenimiento"
          duration: "A negociar"

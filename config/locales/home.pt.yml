      tabs:
        - "Planejamento"
        - "Ux/Ui Design"
        - "Produção"
        - "Testes e garantia"
        - "Entrega e manutenção"
      steps:
        - title: "Planejamento e Descoberta"
          body: "Nesta fase inicial, trabalhamos junto com o cliente para entender necessidades, objetivos e visão do projeto. Realizamos um kickoff para coletar informações essenciais e estabelecer um entendimento claro do escopo e dos requisitos. Ao final, preparamos um plano detalhado que guia o restante do desenvolvimento."
          deliverables: "Prazos de entrega, detalhados por sprint e tarefa concluída"
          duration: "1 a 2 semanas"
        - title: "Ux/Ui Design"
          body: "Nesta fase, focamos na criação de uma experiência do usuário intuitiva e uma interface atraente e funcional. Isso envolve a elaboração de wireframes, protótipos e mockups para visualizar a estrutura e o fluxo de navegação do software."
          deliverables: "Documentação do UX e UI com pesquisa, wireframes, design final e prototipação"
          duration: "3 a 5 semanas"
        - title: "Desenvolvimento"
          body: "Na etapa de produção, a equipe transforma conceitos e designs em código. Isso envolve implementação de funcionalidades, integrações de sistemas e criação de bancos de dados, conforme o escopo do projeto."
          deliverables: "Desenvolvimento e implementação do design final"
          duration: "4+ semanas"
        - title: "Testes e Garantia de Qualidade"
          body: "Após o desenvolvimento, realizamos testes rigorosos para identificar e corrigir defeitos ou problemas de funcionalidade no software."
          deliverables: "Relatório com todos os resultados dos testes"
          duration: "2+ semanas"
        - title: "Entrega e Manutenção"
          body: "Após a conclusão dos testes e a aprovação final, entregamos o software pronto para uso. Além disso, oferecemos serviços contínuos de manutenção para garantir que seu software permaneça atualizado, seguro e funcionando sem problemas a longo prazo."
          deliverables: "Software finalizado com monitoramento e manutenção"
          duration: "A negociar"

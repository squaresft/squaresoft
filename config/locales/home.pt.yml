    faq:
      title: "FAQ"
      items:
        - question: "O que posso esperar ao realizar um projeto com a Square Soft?"
          answer: "Uma abordagem colaborativa e centrada no cliente. Priorizamos comunicação clara, transparência e o entendimento das necessidades do seu negócio, com foco em entregar soluções de alta qualidade alinhadas aos seus objetivos."
        - question: "Os projetos desenvolvidos pela Square Soft são escaláveis?"
          answer: "Sim. Especializamo-nos em soluções escaláveis — seja para uma base pequena de usuários ou para milhões. Construímos sistemas preparados para crescer com o seu negócio."
        - question: "Quanto custa para construir um aplicativo com a Square Soft?"
          answer: "O investimento depende da complexidade, das funcionalidades e da stack tecnológica. Oferecemos soluções sob medida. Fale com nosso time para uma avaliação e orçamento transparente."
        - question: "Quais tecnologias a Square Soft tem especialização?"
          answer: "Selecionamos a stack ideal para cada projeto. Trabalhamos com React/React Native, Ruby on Rails, Go, Python/Django, NestJS/Next.js, Flutter e várias outras tecnologias modernas."
        - question: "Quanto tempo leva para desenvolver um software com a Square Soft?"
          answer: "O prazo varia conforme o escopo. Seguimos metodologia ágil, definimos marcos realistas com o cliente e mantemos você informado em cada etapa."
        - question: "Vocês oferecem suporte e manutenção para os projetos?"
          answer: "Sim. Oferecemos suporte e manutenção pós-lançamento para garantir desempenho, segurança e evolução contínua do produto."
        - question: "Como a Square Soft garante a segurança do software desenvolvido?"
          answer: "Seguimos boas práticas da indústria, realizamos avaliações de segurança e implementamos medidas robustas para proteger sua aplicação contra ameaças."
